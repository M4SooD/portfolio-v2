name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release (for example, v3.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$PUSH_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          node -e "const version = require('./package.json').version; const expected = 'v' + version; if (process.env.RELEASE_TAG !== expected) { console.error('Expected tag ' + expected + ', received ' + process.env.RELEASE_TAG); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Run release quality gate
        run: npm run check

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Portfolio $RELEASE_TAG"
